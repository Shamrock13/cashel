[project]
name = "cashel"
version = "2.1.0"
description = "Firewall configuration auditing tool"
authors = [
    {name = "Derek Lockovich", email = "Derek@cashel.app"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "ciscoconfparse>=1.9,<2.0",
    "flask>=3.0,<4.0",
    "flask-wtf>=1.3.0,<2.0",
    "flask-limiter>=3.5,<4.0",
    "cryptography>=50.0.1,<51.0",
    "paramiko>=5.0,<6.0",
    "apscheduler>=3.10,<4.0",
    "defusedxml>=0.7,<1.0",
    "gunicorn>=22.0,<24.0",
    "flasgger>=0.9,<1.0",
    "playwright>=1.44,<2.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cashel = ["templates/*.html", "static/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting ruff's defaults, which are
# not stable across releases: ruff 0.16.0 broadened them, turning this
# unchanged tree from 0 findings into 203 and failing CI on every PR. These
# four are the rules the project has actually been linting against all along
# (ruff's pre-0.16 defaults), so this changes no behaviour — it just stops a
# ruff upgrade from silently redefining what CI enforces. Widening the set is
# a deliberate call to make on its own, not a side effect of a version bump.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v"

[project.scripts]
cashel = "cashel.main:app"
cashel-web = "cashel.web:main"
